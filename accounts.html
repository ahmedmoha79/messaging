<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Connection Status */
        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            z-index: 1000;
            background: #ff444455;
            color: #ff4444;
        }
        .connection-status.connected {
            background: #00ff8855;
            color: #00ff88;
        }
        
        /* Main Container */
        .account-container {
            max-width: 800px;
            margin: 40px auto;
            width: 90%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Profile Header */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
        }
        .profile-avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
        }
        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .avatar-edit-icon {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .avatar-edit-icon:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
        }
        .profile-name {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-email {
            opacity: 0.8;
            font-size: 1em;
            margin-bottom: 15px;
        }
        .profile-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            background: rgba(0, 255, 136, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .online { background: #00ff88; box-shadow: 0 0 10px #00ff8855; }
        .offline { background: #666; }
        
        /* Profile Sections */
        .profile-section {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .section-title {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #00ff88;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .detail-row {
            display: flex;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .detail-label {
            width: 150px;
            opacity: 0.7;
            font-size: 0.95em;
        }
        .detail-value {
            flex: 1;
            font-weight: 500;
        }
        
        /* Name Editing */
        .edit-name-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }
        .name-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 1em;
            width: 250px;
        }
        .edit-icon {
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s ease;
        }
        .edit-icon:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        .name-availability {
            margin-top: 5px;
            font-size: 0.8em;
        }
        .available {
            color: #00ff88;
        }
        .unavailable {
            color: #ff4444;
        }
        
        /* Activity Log */
        .activity-log {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .activity-log::-webkit-scrollbar {
            width: 5px;
        }
        .activity-log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .activity-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-time {
            font-size: 0.8em;
            opacity: 0.6;
            margin-top: 5px;
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            font-size: 0.95em;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
            color: #000;
        }
        .btn-danger {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* Loading and Error States */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
            color: #ffffff;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-left-color: #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
            color: #ff4444;
            text-align: center;
        }
        .error-state button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #00ff88;
            border: none;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
        }
        
        /* Navigation */
        .nav-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .nav-button:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        
        /* Confirmation Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        
        /* Avatar Upload Modal */
        .avatar-upload-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .avatar-upload-content {
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .avatar-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 20px auto;
            border: 3px solid #00ff88;
            display: none;
        }
        .file-input-label {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
            color: #000;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .file-input-label:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        #avatarUpload {
            display: none;
        }
        .upload-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        
        /* Bio Editing */
        .bio-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 1em;
            width: 100%;
            min-height: 100px;
            resize: vertical;
            margin-bottom: 10px;
        }
        .edit-bio-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }
        
        /* Followers/Following Modal */
        .followers-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .followers-content {
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .follower-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .follower-item:last-child {
            border-bottom: none;
        }
        .follower-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
        }
        .follower-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .follower-info {
            flex: 1;
        }
        .follower-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .follower-email {
            opacity: 0.7;
            font-size: 0.9em;
        }
        
        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .account-container {
                margin: 20px auto;
                padding: 20px;
                width: 95%;
            }
            .profile-header {
                margin-bottom: 20px;
            }
            .profile-avatar-container {
                width: 100px;
                height: 100px;
            }
            .detail-row {
                flex-direction: column;
                gap: 5px;
            }
            .detail-label {
                width: 100%;
            }
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .name-input {
                width: 100%;
            }
            .avatar-upload-content {
                padding: 20px;
            }
            .avatar-preview {
                width: 120px;
                height: 120px;
            }
        }

        /* Add this CSS in the style section */
        .social-stats {
            display: flex;
            gap: 40px;
            margin: 25px 0;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 10px 20px;
            border-radius: 10px;
        }
        .stat-item:hover {
            background: rgba(0, 255, 136, 0.1);
            transform: translateY(-2px);
        }
        .stat-count {
            font-size: 1.8em;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 1em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="connection-status">Connecting...</div>
    
    <a href="message.html" class="nav-button">
        <i class="fas fa-arrow-left"></i> Back to Messages
    </a>
    
    <div id="accountContent" class="account-container">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading your account...</p>
        </div>
    </div>

    <!-- Avatar Upload Modal -->
    <div id="avatarUploadModal" class="avatar-upload-modal">
        <div class="avatar-upload-content">
            <h2>Update Profile Picture</h2>
            <label for="avatarUpload" class="file-input-label">
                <i class="fas fa-upload"></i> Choose Image
            </label>
            <input type="file" id="avatarUpload" accept="image/*">
            <img id="avatarPreview" class="avatar-preview" alt="Preview">
            <div class="upload-buttons">
                <button class="btn btn-secondary" id="cancelUploadBtn">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button class="btn btn-primary" id="confirmUploadBtn" disabled>
                    <i class="fas fa-check"></i> Confirm
                </button>
            </div>
            <p id="uploadStatus" style="margin-top: 15px; font-size: 0.9em;"></p>
        </div>
    </div>

    <!-- Followers/Following Modal -->
    <div id="followersModal" class="followers-modal">
        <div class="followers-content">
            <h2 id="followersModalTitle">Followers</h2>
            <div id="followersList"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="closeFollowersBtn">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuration
        const SUPABASE_URL = "https://twsqvdxhsfvdibhpfvqr.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3c3F2ZHhoc2Z2ZGliaHBmdnFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNDA2MzUsImV4cCI6MjA1NTcxNjYzNX0.EVjqobvn9fAd4djsBfg1zOlA2CVSeYukmsc_DMhT1b4";
        
        let supabaseClient, presenceChannel;
        let currentUserId = null, session = null;
        let isOnline = false;
        let isEditingName = false;
        let originalName = '';
        let currentName = '';
        let selectedAvatarFile = null;
        let account = null;

        // Initialize the application
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Initialize Supabase client
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: false,
                        storage: {
                            getItem: (key) => {
                                return localStorage.getItem(key) || 
                                       localStorage.getItem('sb-' + SUPABASE_URL.split('//')[1].split('.')[0] + '-auth-token') || 
                                       localStorage.getItem('session');
                            },
                            setItem: (key, value) => localStorage.setItem(key, value),
                            removeItem: (key) => localStorage.removeItem(key)
                        }
                    }
                });

                // Check session in background
                const { data: { session: currentSession }, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError) throw sessionError;
                session = currentSession;

                if (!session) {
                    // Redirect to login if no session found
                    window.location.href = 'login.html';
                    return;
                }

                currentUserId = session?.user?.id;

                // Verify user in background
                const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
                if (authError) throw authError;
                if (!user) throw new Error("User verification failed");

                // Load account data
                await loadAccountData();
                initializeRealtime();
                setupAvatarUpload();

            } catch (error) {
                console.error("Initialization error:", error);
                showError(`Failed to load account: ${error.message}`);
            }
        });

        // Load account data
        async function loadAccountData() {
            try {
                // Use a single query to get all required data
                const { data: account, error: accountError } = await supabaseClient
                    .from('users')
                    .select(`
                        id,
                        email,
                        name,
                        created_at,
                        lastonline,
                        avatar_url,
                        role,
                        status,
                        mfa_enabled,
                        last_password_change
                    `)
                    .eq('id', currentUserId)
                    .single();
                
                // If user doesn't exist, create one
                if (accountError && accountError.code === 'PGRST116') {
                    const { data: newUser, error: createError } = await supabaseClient
                        .from('users')
                        .insert([{
                            id: currentUserId,
                            email: session.user.email,
                            name: session.user.email.split('@')[0],
                            created_at: new Date().toISOString(),
                            lastonline: new Date().toISOString(),
                            role: 'user',
                            status: 'online'
                        }])
                        .select(`
                            id,
                            email,
                            name,
                            created_at,
                            lastonline,
                            avatar_url,
                            role,
                            status,
                            mfa_enabled,
                            last_password_change
                        `)
                        .single();

                    if (createError) throw createError;
                    account = newUser;
                } else if (accountError) {
                    throw accountError;
                }

                // Fetch follower and following counts
                const [followersCount, followingCount] = await Promise.all([
                    supabaseClient
                        .from('follows')
                        .select('*', { count: 'exact', head: true })
                        .eq('following_id', currentUserId),
                    supabaseClient
                        .from('follows')
                        .select('*', { count: 'exact', head: true })
                        .eq('follower_id', currentUserId)
                ]);

                // Add counts to account object
                account.followers_count = followersCount.count || 0;
                account.following_count = followingCount.count || 0;
                
                // Fetch recent activity from security_logs
                const { data: activity, error: activityError } = await supabaseClient
                    .from('security_logs')
                    .select('*')
                    .eq('user_id', currentUserId)
                    .order('created_at', { ascending: false })
                    .limit(5);
                
                if (activityError) throw activityError;

                // Render the account page
                renderAccountPage(account, activity || []);

            } catch (error) {
                console.error('Failed to load account data:', error);
                showError('Failed to load account data. Please try again.');
                
                // Log the error to security logs
                await supabaseClient
                    .from('security_logs')
                    .insert([{
                        user_id: currentUserId,
                        action: 'Failed to load account data',
                        status: 'failed',
                        error: error.message,
                        created_at: new Date().toISOString()
                    }]);
            }
        }

        function renderAccountPage(account, activity) {
            const accountContent = document.getElementById('accountContent');
            originalName = account.name || '';
            currentName = originalName;
            
            // Format dates
            const createdAt = account.created_at ? new Date(account.created_at) : null;
            const lastActive = account.lastonline ? new Date(account.lastonline) : null;
            
            accountContent.innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar-container">
                        <img id="profileAvatar" src="${account.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(account.name || 'User')}&background=random`}" 
                            class="profile-avatar" alt="${account.name || 'User'}">
                        <div class="avatar-edit-icon" id="editAvatarBtn">
                            <i class="fas fa-pencil-alt"></i>
                        </div>
                    </div>
                    <h1 class="profile-name">
                        <span id="nameDisplay">${account.name || 'User'}</span>
                        <i class="fas fa-pencil-alt edit-icon" id="editNameIcon"></i>
                    </h1>
                    <div class="edit-name-container" id="editNameContainer" style="display: none;">
                        <input type="text" class="name-input" id="nameInput" value="${account.name || ''}" maxlength="50">
                        <button class="btn btn-primary" id="saveNameBtn" disabled>
                            <i class="fas fa-check"></i> Save
                        </button>
                        <button class="btn btn-secondary" id="cancelEditBtn">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                    </div>
                    <div class="name-availability" id="nameAvailability"></div>
                    <p class="profile-email">${account.email || 'No email'}</p>
                    <div class="profile-status">
                        <span id="statusIndicator" class="status-indicator ${isOnline ? 'online' : 'offline'}"></span>
                        <span id="statusText">${isOnline ? 'Online' : formatLastOnline(lastActive)}</span>
                    </div>
                    <div class="social-stats">
                        <div class="stat-item" id="followersStat">
                            <span class="stat-count">${account.followers_count || 0}</span>
                            <span class="stat-label">Followers</span>
                        </div>
                        <div class="stat-item" id="followingStat">
                            <span class="stat-count">${account.following_count || 0}</span>
                            <span class="stat-label">Following</span>
                        </div>
                    </div>
                </div>
                
                <div class="profile-section">
                    <div class="section-title">
                        <i class="fas fa-info-circle"></i> Account Information
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Name</div>
                        <div class="detail-value">${account.name || 'Not provided'}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Email</div>
                        <div class="detail-value">${account.email || 'Not provided'}</div>
                    </div>
                    <div class="detail-row">

        function setupAvatarUpload() {
            const avatarUpload = document.getElementById('avatarUpload');
            const avatarPreview = document.getElementById('avatarPreview');
            const confirmUploadBtn = document.getElementById('confirmUploadBtn');
            const cancelUploadBtn = document.getElementById('cancelUploadBtn');
            const uploadStatus = document.getElementById('uploadStatus');
            const avatarUploadModal = document.getElementById('avatarUploadModal');

            // Handle file selection with validation
            avatarUpload.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // Validate file size (2MB limit)
                if (file.size > 2 * 1024 * 1024) {
                        uploadStatus.textContent = 'File size must be less than 2MB';
                        uploadStatus.style.color = '#ff4444';
                        confirmUploadBtn.disabled = true;
                        return;
                    }
                    
                // Validate file type
                    const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
                    if (!validTypes.includes(file.type)) {
                        uploadStatus.textContent = 'Only JPG, PNG, GIF or WEBP files are allowed';
                        uploadStatus.style.color = '#ff4444';
                        confirmUploadBtn.disabled = true;
                        return;
                    }

                // Validate image dimensions
                try {
                    const img = new Image();
                    img.src = URL.createObjectURL(file);
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                    });
                    
                    if (img.width < 100 || img.height < 100) {
                        uploadStatus.textContent = 'Image must be at least 100x100 pixels';
                        uploadStatus.style.color = '#ff4444';
                        confirmUploadBtn.disabled = true;
                        return;
                    }
                    
                    if (img.width > 2000 || img.height > 2000) {
                        uploadStatus.textContent = 'Image must be less than 2000x2000 pixels';
                        uploadStatus.style.color = '#ff4444';
                        confirmUploadBtn.disabled = true;
                        return;
                    }
                    
                    URL.revokeObjectURL(img.src);
                } catch (error) {
                    uploadStatus.textContent = 'Invalid image file';
                    uploadStatus.style.color = '#ff4444';
                    confirmUploadBtn.disabled = true;
                    return;
                }
                    
                    selectedAvatarFile = file;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        avatarPreview.src = event.target.result;
                        avatarPreview.style.display = 'block';
                        confirmUploadBtn.disabled = false;
                        uploadStatus.textContent = '';
                    };
                    reader.readAsDataURL(file);
            });

            // Handle upload confirmation with retry logic
            confirmUploadBtn.addEventListener('click', async () => {
                if (!selectedAvatarFile) return;
                
                confirmUploadBtn.disabled = true;
                confirmUploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
                uploadStatus.textContent = 'Uploading...';
                uploadStatus.style.color = '#00ff88';
                
                try {
                    // Generate unique filename with user folder and timestamp
                    const fileExt = selectedAvatarFile.name.split('.').pop();
                    const timestamp = Date.now();
                    const fileName = `avatar_${timestamp}.${fileExt}`;
                    const filePath = `${currentUserId}/${fileName}`;
                    
                    // First delete any existing avatar to avoid conflicts
                    try {
                        const { data: existingFiles, error: listError } = await supabaseClient
                            .storage
                            .from('avatars')
                            .list(currentUserId);
                        
                        if (!listError && existingFiles) {
                            const filesToDelete = existingFiles.map(file => `${currentUserId}/${file.name}`);
                            if (filesToDelete.length > 0) {
                                await supabaseClient
                                    .storage
                                    .from('avatars')
                                    .remove(filesToDelete);
                            }
                        }
                    } catch (deleteError) {
                        console.log('No existing avatar to delete');
                    }
                    
                    // Upload the new avatar with retry logic
                    let retries = 3;
                    let uploadData;
                    
                    while (retries > 0) {
                        try {
                            const { data, error: uploadError } = await supabaseClient
                        .storage
                        .from('avatars')
                        .upload(filePath, selectedAvatarFile, {
                            cacheControl: '3600',
                            upsert: true,
                            contentType: selectedAvatarFile.type
                        });
                    
                    if (uploadError) throw uploadError;
                            uploadData = data;
                            break;
                        } catch (error) {
                            retries--;
                            if (retries === 0) throw error;
                            await new Promise(resolve => setTimeout(resolve, 1000));
                        }
                    }
                    
                    // Get public URL with cache busting
                    const { data: { publicUrl } } = supabaseClient
                        .storage
                        .from('avatars')
                        .getPublicUrl(filePath);
                    
                    // Update user record with new avatar URL
                    const { error: updateError } = await supabaseClient
                        .from('users')
                        .update({ 
                            avatar_url: publicUrl,
                            lastonline: new Date().toISOString()
                        })
                        .eq('id', currentUserId);
                    
                    if (updateError) throw updateError;
                    
                    // Log the activity
                    await supabaseClient
                        .from('security_logs')
                        .insert([{
                            user_id: currentUserId,
                            action: 'Updated profile picture',
                            status: 'success',
                            created_at: new Date().toISOString()
                        }]);
                    
                    // Update the avatar display with cache busting
                    document.getElementById('profileAvatar').src = `${publicUrl}?t=${timestamp}`;
                    
                    // Close modal and reset
                    avatarUploadModal.style.display = 'none';
                    avatarPreview.style.display = 'none';
                    avatarPreview.src = '';
                    avatarUpload.value = '';
                    selectedAvatarFile = null;
                    confirmUploadBtn.innerHTML = '<i class="fas fa-check"></i> Confirm';
                    
                    // Show success message
                    uploadStatus.textContent = 'Profile picture updated successfully!';
                    uploadStatus.style.color = '#00ff88';
                    
                } catch (error) {
                    console.error('Error uploading avatar:', error);
                    uploadStatus.textContent = 'Error uploading: ' + error.message;
                    uploadStatus.style.color = '#ff4444';
                    confirmUploadBtn.disabled = false;
                    confirmUploadBtn.innerHTML = '<i class="fas fa-check"></i> Confirm';
                    
                    // Log the error
                    await supabaseClient
                        .from('security_logs')
                        .insert([{
                            user_id: currentUserId,
                            action: 'Failed to update profile picture',
                            status: 'failed',
                            error: error.message,
                            created_at: new Date().toISOString()
                        }]);
                }
            });

            // Handle cancel button
            cancelUploadBtn.addEventListener('click', () => {
                avatarUploadModal.style.display = 'none';
                avatarPreview.style.display = 'none';
                avatarPreview.src = '';
                avatarUpload.value = '';
                selectedAvatarFile = null;
                uploadStatus.textContent = '';
                confirmUploadBtn.disabled = true;
                confirmUploadBtn.innerHTML = '<i class="fas fa-check"></i> Confirm';
            });
        }

        async function checkNameAvailability() {
            const newName = document.getElementById('nameInput').value.trim();
            const availabilityElement = document.getElementById('nameAvailability');
            const saveBtn = document.getElementById('saveNameBtn');
            
            if (newName.toLowerCase() === originalName.toLowerCase()) {
                availabilityElement.textContent = 'This is your current name';
                availabilityElement.className = 'name-availability';
                saveBtn.disabled = true;
                return;
            }
            
            if (newName.length < 3) {
                availabilityElement.textContent = 'Name must be at least 3 characters';
                availabilityElement.className = 'name-availability unavailable';
                saveBtn.disabled = true;
                return;
            }
            
            if (newName.length > 50) {
                availabilityElement.textContent = 'Name must be less than 50 characters';
                availabilityElement.className = 'name-availability unavailable';
                saveBtn.disabled = true;
                return;
            }
            
            try {
                // Case-insensitive check
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('name')
                    .ilike('name', newName)
                    .neq('id', currentUserId);
                
                if (error) throw error;
                
                if (data && data.length > 0) {
                    availabilityElement.textContent = 'Name is already taken';
                    availabilityElement.className = 'name-availability unavailable';
                    saveBtn.disabled = true;
                } else {
                    availabilityElement.textContent = 'Name is available';
                    availabilityElement.className = 'name-availability available';
                    saveBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error checking name:', error);
                availabilityElement.textContent = 'Error checking name availability';
                availabilityElement.className = 'name-availability unavailable';
                saveBtn.disabled = true;
            }
        }

        function formatLastOnline(date) {
            if (!date) return 'Never';
            
            const diff = (Date.now() - date) / 60000;
            if (diff < 1) return 'Just now';
            if (diff < 60) return `${Math.floor(diff)} minutes ago`;
            if (diff < 1440) return `${Math.floor(diff/60)} hours ago`;
            return `${Math.floor(diff/1440)} days ago`;
        }

        // Initialize realtime functionality
        async function initializeRealtime() {
            updateConnectionStatus("Connecting to real-time service...");
            
            try {
                // Remove existing channels if they exist
                if (presenceChannel) {
                    await supabaseClient.removeChannel(presenceChannel);
                }

                // Create a new channel with optimized configuration
                presenceChannel = supabaseClient.channel('presence-channel', {
                    config: { 
                        presence: { 
                            key: currentUserId,
                            timeout: 10000, // 10 seconds timeout
                            heartbeatInterval: 5000 // 5 seconds heartbeat
                        },
                        broadcast: {
                            self: true
                        } 
                    }
                })
                .on('presence', { event: 'sync' }, () => {
                    const state = presenceChannel.presenceState();
                    updateOnlineStatus(Object.keys(state).length > 0);
                })
                .subscribe(async (status, error) => {
                    if (status === 'SUBSCRIBED') {
                        try {
                        await presenceChannel.track({ 
                            online_at: new Date().toISOString(),
                            user_id: currentUserId
                        });
                        
                            // Update last online in database with retry logic
                            let retries = 3;
                            while (retries > 0) {
                                try {
                        await supabaseClient
                            .from('users')
                            .update({ lastonline: new Date().toISOString() })
                            .eq('id', currentUserId);
                                    break;
                                } catch (updateError) {
                                    retries--;
                                    if (retries === 0) throw updateError;
                                    await new Promise(resolve => setTimeout(resolve, 1000));
                                }
                            }
                            
                            updateConnectionStatus("Connected");
                            updateOnlineStatus(true);
                        } catch (trackError) {
                            console.error('Error tracking presence:', trackError);
                            updateConnectionStatus("Error tracking presence", true);
                            setTimeout(initializeRealtime, 3000);
                        }
                    }
                    if (error) {
                        console.error('Presence channel error:', error);
                        updateConnectionStatus("Error: " + error.message, true);
                        setTimeout(initializeRealtime, 5000);
                    }
                });

                // Handle channel connection events with exponential backoff
                let reconnectAttempts = 0;
                const maxReconnectAttempts = 5;
                
                presenceChannel
                    .on('CLOSE', () => {
                        updateConnectionStatus("Reconnecting...", true);
                        updateOnlineStatus(false);
                        
                        // Exponential backoff for reconnection
                        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                        reconnectAttempts = Math.min(reconnectAttempts + 1, maxReconnectAttempts);
                        
                        setTimeout(() => {
                            initializeRealtime();
                        }, delay);
                    })
                    .on('ERROR', (error) => {
                        console.error("Realtime error:", error);
                        updateConnectionStatus("Error: " + error.message, true);
                        updateOnlineStatus(false);
                        
                        // Reset reconnect attempts on error
                        reconnectAttempts = 0;
                        setTimeout(initializeRealtime, 5000);
                    });

            } catch (error) {
                console.error("Realtime connection error:", error);
                updateConnectionStatus("Realtime failed: " + error.message, true);
                updateOnlineStatus(false);
                
                // Log the error to security logs
                await supabaseClient
                    .from('security_logs')
                    .insert([{
                        user_id: currentUserId,
                        action: 'Realtime connection failed',
                        status: 'failed',
                        error: error.message,
                        created_at: new Date().toISOString()
                    }]);
            
                setTimeout(initializeRealtime, 5000);
            }
        }

        }

        async function showFollowersList(type) {
            const modal = document.getElementById('followersModal');
            const title = document.getElementById('followersModalTitle');
            const list = document.getElementById('followersList');
            
            title.textContent = type === 'followers' ? 'Followers' : 'Following';
            list.innerHTML = '<div class="loading-spinner"></div>';
            modal.style.display = 'flex';
            
            try {
                // First get the follow relationships
                const { data: follows, count, error: followsError } = await supabaseClient
                    .from('follows')
                    .select('*', { count: 'exact' })
                    .eq(type === 'followers' ? 'following_id' : 'follower_id', currentUserId)
                    .order('created_at', { ascending: false });
                
                if (followsError) throw followsError;
                
                // Update the stats display to match the actual count
                const statCount = document.querySelector(`#${type}Stat .stat-count`);
                if (statCount) {
                    statCount.textContent = count || 0;
                }
                
                if (!count || count === 0) {
                    list.innerHTML = '<p style="text-align: center; opacity: 0.7;">No ' + type + ' yet</p>';
                    return;
                }

                // Get the user IDs we need to fetch
                const userIds = follows.map(follow => 
                    type === 'followers' ? follow.follower_id : follow.following_id
                );

                // Fetch the user details
                const { data: users, error: usersError } = await supabaseClient
                    .from('users')
                    .select('id, name, email, avatar_url')
                    .in('id', userIds);

                if (usersError) throw usersError;

                // Create a map of user data for easy lookup
                const usersMap = users.reduce((acc, user) => {
                    acc[user.id] = user;
                    return acc;
                }, {});

                // Render the list using the user data
                list.innerHTML = follows.map(follow => {
                    const userId = type === 'followers' ? follow.follower_id : follow.following_id;
                    const user = usersMap[userId];
                    if (!user) return '';
                    
                    return `
                    <div class="follower-item">
                        <div class="follower-avatar">
                            <img src="${user.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=random`}" 
                                alt="${user.name}">
                        </div>
                        <div class="follower-info">
                            <div class="follower-name">${user.name}</div>
                            <div class="follower-email">${user.email}</div>
                        </div>
                    </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Error loading ' + type + ':', error);
                list.innerHTML = '<p style="text-align: center; color: #ff4444;">Failed to load ' + type + '</p>';
                
                // Log the error to security logs
                await supabaseClient
                    .from('security_logs')
                    .insert([{
                        user_id: currentUserId,
                        action: `Failed to load ${type} list`,
                        status: 'failed',
                        error: error.message,
                        created_at: new Date().toISOString()
                    }]);
            }
        }
    </script>
</body>
</html>
