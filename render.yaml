services:
  - type: web
    name: messaging-app
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://twsqvdxhsfvdibhpfvqr.supabase.co
      # The anon key is safe to expose: row-level security protects the data.
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3c3F2ZHhoc2Z2ZGliaHBmdnFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNDA2MzUsImV4cCI6MjA1NTcxNjYzNX0.EVjqobvn9fAd4djsBfg1zOlA2CVSeYukmsc_DMhT1b4
      # Set these in the Render dashboard (never commit them):
      - key: OPENWEATHER_API_KEY
        sync: false
      # Optional TURN relay for calls on strict networks, e.g. turn:global.relay.metered.ca:80,turns:global.relay.metered.ca:443
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
