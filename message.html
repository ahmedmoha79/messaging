<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WAZAMBI Secure Messaging</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ff88;
            --primary-dark: #00cc66;
            --primary-light: rgba(0, 255, 136, 0.1);
            --danger: #ff4444;
            --danger-light: rgba(255, 68, 68, 0.1);
            --background: #0a0a0a;
            --surface: #121212;
            --surface-light: #1e1e1e;
            --surface-lighter: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-tertiary: #666666;
            --border: rgba(255, 255, 255, 0.1);
            --online: #00ff88;
            --offline: #666666;
            --battery-high: #00ff88;
            --battery-medium: #ffcc00;
            --battery-low: #ff4444;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 320px;
            --header-height: 60px;
            --map-controls-bottom: 20px;
            --map-controls-right: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* App Layout */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        /* Session Check - Professional Loading */
        .session-check {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--background);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .session-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--primary) 0%, #00ccff 100%);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #000;
            animation: pulse 2s infinite;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .session-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            background: linear-gradient(to right, var(--primary), #00ccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .session-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            max-width: 300px;
        }

        .session-progress {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .session-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, var(--primary), #00ccff);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        /* Connection Status - Enhanced */
        .connection-status {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 6px 12px;
            border-radius: var(--radius-md);
            font-size: 10px;
            font-weight: 500;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.8);
            color: var(--danger);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            border-left: 3px solid currentColor;
            opacity: 0;
            transform: translateY(-20px);
            max-width: 180px;
        }

        .connection-status.connected {
            color: var(--online);
            border-left-color: var(--online);
            opacity: 1;
            transform: translateY(0);
        }

        .connection-status i {
            font-size: 12px;
        }

       /* App Header - Adjusted for mobile spacing */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .app-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .app-title i {
            color: var(--primary);
        }

        .app-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-button {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .battery-indicator-header {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .battery-indicator-header i {
            font-size: 12px;
        }

        /* Sidebar - Enhanced for both mobile and desktop */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100%;
            background: var(--surface);
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s ease-out;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            overflow: hidden;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 10;
            height: var(--header-height);
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-title i {
            color: var(--primary);
        }

        .close-sidebar {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .close-sidebar:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .search-bar {
            padding: 12px 16px;
            background: var(--surface);
            position: sticky;
            top: var(--header-height);
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-secondary);
            font-size: 16px;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            scrollbar-width: none;
        }

        .user-list::-webkit-scrollbar {
            display: none;
        }

        /* User Card - Enhanced with more details */
        .user-card {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin: 0 8px 8px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            background: var(--surface-light);
            position: relative;
            overflow: hidden;
        }

        .user-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .user-card.active {
            background: linear-gradient(90deg, rgba(42, 42, 42, 0.8) 0%, rgba(26, 26, 26, 0.8) 100%);
            border-left: 4px solid var(--primary);
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            position: relative;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-info h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-info p {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            margin-left: 8px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--offline);
            position: relative;
        }

        .status-indicator.online {
            background: var(--online);
            box-shadow: 0 0 8px var(--primary-light);
        }

        .status-indicator.online::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: var(--online);
            animation: pulse 2s infinite;
            opacity: 0.4;
            z-index: -1;
        }

        .battery-indicator {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .battery-indicator.high {
            color: var(--battery-high);
        }

        .battery-indicator.medium {
            color: var(--battery-medium);
        }

        .battery-indicator.low {
            color: var(--battery-low);
        }

        .new-message-notification {
            position: absolute;
            top: 12px;
            right: 16px;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            display: none;
        }

        .user-card.has-unread .new-message-notification {
            display: block;
            animation: pulse 1.5s infinite;
        }

        /* Map Container - Enhanced */
        .map-container {
            flex: 1;
            position: relative;
            height: 100%;
            width: 100%;
        }

        #map {
            height: 100%;
            width: 100%;
            background: #1a1a1a;
        }

        /* Map Controls - Enhanced */
        .map-controls {
            position: absolute;
            bottom: var(--map-controls-bottom);
            right: var(--map-controls-right);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
        }

        .map-control {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(5px);
        }

        .map-control:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .map-control.active {
            background: var(--primary);
            color: #000;
        }

        #locationButton {
            background: var(--primary);
            color: #000;
            animation: float 3s ease-in-out infinite;
        }

        #locationButton:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        /* User Marker - Enhanced with more details */
        .user-marker {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            transition: var(--transition);
            background: rgba(0, 0, 0, 0.7);
            color: white;
        }

        .user-marker.online {
            border-color: var(--online);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
        }

        .user-marker.offline {
            border-color: var(--offline);
            opacity: 0.7;
        }

        .user-marker-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 255, 136, 0.3);
            animation: pulse 2s infinite;
            z-index: -1;
        }

        .user-marker-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            white-space: nowrap;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 180px;
        }

        .user-marker:hover .user-marker-tooltip {
            opacity: 1;
        }

        .tooltip-name {
            font-weight: 600;
            font-size: 13px;
        }

        .tooltip-status {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .tooltip-status i {
            font-size: 10px;
        }

        .tooltip-battery {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }

        .tooltip-location {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Current User Marker - Special Styling */
        .current-user-marker {
            border-width: 3px;
            width: 48px;
            height: 48px;
        }

        /* Chat View - Redesigned with better layout */
        .chat-view {
            position: fixed;
            top: var(--header-height);
            left: 0;
            width: 100%;
            height: calc(100% - var(--header-height));
            background: var(--surface);
            z-index: 900;
            display: none;
            flex-direction: column;
        }

        .chat-view.active {
            display: flex;
        }

        .chat-header {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 10;
            height: var(--header-height);
        }

        .back-button {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-partner {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .chat-partner-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 16px;
            flex-shrink: 0;
        }

        .chat-partner-info {
            flex: 1;
            min-width: 0;
        }

        .chat-partner-name {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-partner-status {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-partner-status .status-indicator {
            width: 8px;
            height: 8px;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-messages::-webkit-scrollbar {
            display: none;
        }

        .message {
            display: flex;
            animation: messageAppear 0.3s ease-out forwards;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            position: relative;
            word-break: break-word;
            line-height: 1.4;
            font-size: 15px;
            box-shadow: var(--shadow);
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.sent .message-content {
            background: linear-gradient(135deg, var(--primary) 0%, #00ccff 100%);
            color: #000;
            border-bottom-right-radius: 4px;
        }

        .message.received .message-content {
            background: rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-tertiary);
            display: block;
            text-align: right;
            margin-top: 4px;
        }

        /* Audio Message Styles */
        .audio-message-container {
            max-width: 240px;
            min-width: 160px;
            margin: 4px 0;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            width: 100%;
        }

        .audio-play-button {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: #000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .message.sent .audio-play-button {
            background: #000;
            color: var(--primary);
        }

        .audio-progress-container {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .audio-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--primary);
            border-radius: 2px;
            width: 0%;
        }

        .message.sent .audio-progress-bar {
            background: #000;
        }

        .audio-time {
            font-size: 11px;
            color: var(--text-secondary);
            min-width: 36px;
            text-align: center;
            flex-shrink: 0;
        }

        .audio-visualizer {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 24px;
            margin-top: 6px;
            padding: 0 4px;
        }

        .audio-wave-bar {
            flex: 1;
            background: var(--primary-light);
            border-radius: 2px;
            min-width: 2px;
            transition: height 0.1s ease;
        }

        .message.sent .audio-wave-bar {
            background: rgba(0, 0, 0, 0.3);
        }

        .audio-message-container.playing .audio-wave-bar {
            animation: wavePulse 1s infinite alternate;
        }

        /* Message Input Container with Audio Button */
        .message-input-container {
            padding: 8px 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: flex-end;
            background: rgba(0, 0, 0, 0.8);
            position: sticky;
            bottom: 0;
            backdrop-filter: blur(10px);
        }

        .audio-record-button {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .audio-record-button:hover {
            background: rgba(0, 255, 136, 0.1);
        }

        .audio-record-button.recording {
            color: var(--danger);
            animation: pulse 1.5s infinite;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            resize: none;
            min-height: 48px;
            max-height: 120px;
            font-size: 15px;
            transition: var(--transition);
        }

        .message-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .send-button {
            background: linear-gradient(135deg, var(--primary) 0%, #00ccff 100%);
            border: none;
            border-radius: var(--radius-md);
            color: #000;
            padding: 12px 16px;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-button:hover {
            transform: translateY(-1px);

        /* Audio Recording UI - Futuristic Design */
        .recording-container {

            justify-content: center;

            top: 0;
            left: 0;
            right: 0;

        .visualizer-bar {

        .recording-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;

        .recording-timer {

            font-size: 1.1em;

            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);

        .recording-stop-button,
        .recording-cancel-button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 1.2em;
            position: relative;
            overflow: hidden;

        .recording-stop-button {
            background: linear-gradient(135deg, var(--primary) 0%, #00ccff 100%);

            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .recording-stop-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
        }

        .recording-cancel-button {
            background: rgba(255, 68, 68, 0.1);
            color: var(--danger);
        }

        .recording-cancel-button:hover {
            background: var(--danger);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        .recording-stop-button::after,
        .recording-cancel-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .recording-stop-button:hover::after,
        .recording-cancel-button:hover::after {
            opacity: 1;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* Processing UI - Enhanced */
        .processing-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1001;

        .processing-spinner {

        .processing-text {

            text-shadow: 0 0 10px rgba(0, 255, 136, 0.2);

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .recording-container {
                bottom: 70px;

            .recording-timer {

        /* Typing Indicator - Enhanced */
        .typing-indicator {
            position: relative;
            bottom: 0;
            left: 16px;

        @keyframes typingPulse {

        .loading-state {

        .loading-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Error State - Improved */
        .error-state {
            display: flex;
            flex-direction: column;

        .error-button {
            padding: 12px 24px;

            border-radius: var(--radius-md);

            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);

        .error-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        /* Mobile Notification - Enhanced */
        .mobile-notification {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            z-index: 2000;
            transform: translateY(-120%);

            transition: var(--transition);

            box-shadow: var(--shadow);

            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-notification.active {
            transform: translateY(0);
            opacity: 1;
        }

        .notification-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
            overflow: hidden;
        }

        .notification-avatar img {
            width: 100%;
            height: 100%;

        }

        .notification-text {
            flex: 1;
            min-width: 0;
        }

        .notification-text strong {
            display: block;
            font-size: 14px;
            margin-bottom: 2px;
            color: var(--text-primary);
        }

        .notification-text p {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;

        /* Animations */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 60%, 100% { opacity: 0.3; transform: scale(1); }
            30% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes typingPulse {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-3px); }
        }

        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes wavePulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Responsive Adjustments */
        @media (min-width: 768px) {

            :root {
                --sidebar-width: 360px;

            .app-container {
                flex-direction: row;
            }

                position: relative;

                border-left: 1px solid var(--border);

           .app-header {
           display: flex;
           padding-left: 16px;
}
            .user-card {
                padding: 12px 16px;

            }

            .message-content {
                max-width: 65%;

            /* Hide mobile-only elements */
            .mobile-notification {
                display: none;

        /* Special adjustments for very small screens */
        @media (max-width: 360px) {

                --header-height: 56px;
                --map-controls-bottom: 16px;
                --map-controls-right: 12px;

            .user-card {
                padding: 10px 12px;
            }

            .user-avatar {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .message-input-container {
                padding: 10px 12px;

            .message-input, .send-button {
                min-height: 44px;

                width: 44px;
                height: 44px;
                font-size: 18px;
            }

        /* Prevent body scrolling when sidebar is open */
        body.sidebar-open {
            overflow: hidden;

        /* Hidden class for toggling visibility */
        .hidden {
            display: none !important;

        /* Message Status Styles - Enhanced */
        .message-status {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.7);

        .message-status.sent {
            justify-content: flex-end;
        }

        .status-icon {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.3);

            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;

        .status-icon.delivered {

        /* Add these styles in the style section */
        .message-reactions {

                    if (Notification.permission === 'default') {

        function handleUserTyping() {

                            event: 'typing',
                            payload: { senderId: currentUserId, receiverId: selectedUser.id }

                        .catch(console.error);
                }

                lastTypingEventTime = Date.now();
                
                // Debounce "stopped typing" event
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    if (Date.now() - lastTypingEventTime >= TYPING_DEBOUNCE_MS) {
                        isCurrentlyTyping = false;
                        supabaseClient.channel('typing-broadcast')
                            .send({
                                type: 'broadcast',
                                event: 'stopped_typing',
                                payload: { senderId: currentUserId, receiverId: selectedUser.id }

                            .catch(console.error);
                    }
                }, TYPING_DEBOUNCE_MS);

                    isCurrentlyTyping = false;
                    supabaseClient.channel('typing-broadcast')
                        .send({

                            event: 'stopped_typing',

                        })
                        .catch(console.error);
                }
            });

            const parts = name.split(' ');

            return (parts[0].charAt(0) + (parts[1] ? parts[1].charAt(0) : '')).toUpperCase();

        function stringToColor(str) {
            if (!str) return '#666666';
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            let color = '#';
            for (let i = 0; i < 3; i++) {
                const value = (hash >> (i * 8)) & 0xFF;
                color += ('00' + value.toString(16)).substr(-2);
            }
            return color;
        }

        function formatTimeAgo(date) {
            if (!date) return 'unknown';
            
            const seconds = Math.floor((Date.now() - new Date(date)) / 1000);
            
            if (seconds < 60) return 'just now';
            if (seconds < 3600) return `${Math.floor(seconds/60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds/3600)}h ago`;
            return `${Math.floor(seconds/86400)}d ago`;
        }

        function formatLastOnline(date) {
            if (!date) return 'Offline';
            
            const seconds = Math.floor((Date.now() - new Date(date)) / 1000);
            
            if (seconds < 60) return 'Online';
            if (seconds < 180) return 'Online'; // Consider online if seen within 5 minutes
            return formatTimeAgo(date);
        }

                console.error("Map initialization failed:", error);
                throw error;
            }
        }

        function startLocationTracking() {
            if (navigator.geolocation) {
                // First try to get current position quickly
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        updateLocation(position);
                    },
                    (error) => {
                        console.error('Initial geolocation error:', error);
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 10000,
                        timeout: 5000
                    }
                );

                // Then set up continuous tracking
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        updateLocation(position);
                    },
                    (error) => {
                        console.error('Geolocation error:', error);
                        // If we have a last position, keep showing it
                        if (lastPosition) {
                            marker.setLatLng([lastPosition.lat, lastPosition.lng]);
                        }
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 30000,
                        timeout: 10000
                    }
                );
            } else {
                console.error('Geolocation not supported');
            }
        }

        async function updateLocation(position) {
            const { latitude, longitude, accuracy } = position.coords;
            lastPosition = { lat: latitude, lng: longitude };
            lastLocationUpdate = new Date();
            
            // Update marker position
            marker.setLatLng([latitude, longitude]);
            
            // Update popup content
            if (marker.getPopup()) {
                const popup = marker.getPopup();
                const content = popup.getContent();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                
                // Safely update elements if they exist
                const updateElement = (selector, value) => {
                    const element = tempDiv.querySelector(selector);
                    if (element) {
                        element.textContent = value;
                    }
                };
                
                // Update location details
                updateElement('#currentLocation', `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`);
                updateElement('#lastUpdate', 'Just now');
                
                // Format accuracy based on value
                let accuracyText;
                if (accuracy <= 10) {
                    accuracyText = 'Very High (≤10m)';
                } else if (accuracy <= 50) {
                    accuracyText = 'High (≤50m)';
                } else if (accuracy <= 100) {
                    accuracyText = 'Medium (≤100m)';
                } else {
                    accuracyText = `Low (${Math.round(accuracy)}m)`;
                }
                updateElement('#locationAccuracy', accuracyText);
                
                // Update battery level with current value
                updateElement('#currentBattery', `${batteryLevel}%`);
                
                // Only update popup content if we have valid content
                if (tempDiv.innerHTML) {
                    popup.setContent(tempDiv.innerHTML);
                }
            }
            
            // Update user location in database
            try {
                const { error } = await supabaseClient
                    .from('user_locations')
                    .upsert({
                        user_id: currentUserId,
                        latitude,
                        longitude,
                        accuracy,
                        last_updated: new Date().toISOString(),
                        device_context: {
                            is_mobile: isMobile,
                            battery_level: batteryLevel,
                            device_type: currentDeviceType,
                            last_online: new Date().toISOString()
                        }
                    });
                
                if (error) throw error;
                
                // Update battery level in cache for current user
                if (userDataCache[currentUserId]) {
                    userDataCache[currentUserId].battery_level = batteryLevel;
                }
                
                // Update user's last online status and device type
                await supabaseClient
                    .from('users')
                    .update({ 
                        lastonline: new Date().toISOString(),
                        status: 'online',
                        device_type: currentDeviceType
                    })
                    .eq('id', currentUserId);
                    
            } catch (error) {
                console.error('Failed to update location:', error);
                // Cache the location locally if update fails
                locationCache[currentUserId] = {
                    latitude,
                    longitude,
                    accuracy,
                    last_updated: new Date().toISOString(),
                    device_context: {
                        is_mobile: isMobile,
                        battery_level: batteryLevel,
                        device_type: currentDeviceType
                    }
                };
            }
        }

        // Database functions
        async function setupDatabaseTables() {
            try {
                // Verify tables exist by querying them
                await supabaseClient.from('messages').select('*').limit(1);
                await supabaseClient.from('user_locations').select('*').limit(1);

        // User functions
        async function loadUsers() {
            try {
                showLoading();
                
                // First verify database tables
                await setupDatabaseTables();
                
                // Get all users except current user with status info
                const { data: users, error: usersError } = await supabaseClient
                    .from('users')
                    .select('id, email, name, lastonline, status, device_type, avatar_url')
                    .neq('id', currentUserId)
                    .order('lastonline', { ascending: false });
                if (usersError) throw usersError;
                
                // Get locations for these users - first try database, then fallback to cache
                let locations = [];
                try {
                    const { data: dbLocations, error: locationsError } = await supabaseClient
                        .from('user_locations')
                        .select('user_id, latitude, longitude, last_updated, device_context')
                        .in('user_id', users.map(u => u.id));
                    
                    if (!locationsError) {
                        locations = dbLocations;
                    }
                } catch (e) {
                    console.error('Failed to fetch locations from DB, using cache:', e);
                }
                
                // Merge with cached locations
                const allLocations = [...locations];
                Object.keys(locationCache).forEach(userId => {
                    if (!allLocations.some(loc => loc.user_id === userId)) {
                        allLocations.push(locationCache[userId]);
                    }
                });
                
                // Get unread message counts
                const { data: unreadCounts, error: unreadError } = await supabaseClient
                    .from('messages')
                    .select('sender_id')
                    .eq('receiver_id', currentUserId)
                    .eq('is_read', false);
                
                if (!unreadError) {
                    unreadCounts.forEach(item => {
                        if (!unreadMessages[item.sender_id]) {
                            unreadMessages[item.sender_id] = 0;
                        }
                        unreadMessages[item.sender_id]++;
                    });
                }
                
                // Combine the data
                const usersWithLocations = users.map(user => {
                    const location = allLocations.find(loc => loc.user_id === user.id);
                    const batteryLevel = location?.device_context?.battery_level || null;
                    
                    return {
                        ...user,
                        user_locations: location ? [location] : [],
                        unread_count: unreadMessages[user.id] || 0,
                        battery_level: batteryLevel,
                        last_location_update: location?.last_updated || null
                    };
                });
                
                // Cache user data
                usersWithLocations.forEach(user => {
                    userDataCache[user.id] = user;
                });
                
                renderUserList(usersWithLocations);
                updateUserMarkers(usersWithLocations);
                
            } catch (error) {
                console.error('Failed to load users:', error);
                showError('Failed to load users. Please try again.');
            }
        }

        async function loadMessages(userId) {
            try {
                const messagesContainer = document.getElementById('chatMessages');
                messagesContainer.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><p>Loading messages...</p></div>';
                
                const { data: messages, error } = await supabaseClient
                    .from('messages')
                    .select('*')
                    .or(`and(sender_id.eq.${currentUserId},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUserId})`)
                    .order('created_at', { ascending: true });
                
                if (error) {
                    console.error('Message load error:', error);
                    throw error;
                }
                
                messagesContainer.innerHTML = '';
                if (messages.length === 0) {
                    messagesContainer.innerHTML = '<div class="loading-state"><p>No messages yet. Start the conversation!</p></div>';
                    return;
                }
                
                messages.forEach(msg => {
                    if (msg.message_type === 'audio') {
                        // Make sure we have all required audio data
                        if (msg.audio_url && msg.audio_duration) {
                            const audioData = {
                                id: msg.id,
                                url: msg.audio_url,
                                duration: msg.audio_duration,
                                waveform: msg.audio_waveform || [0.3,0.5,0.7,0.5,0.3], // Default waveform if missing
                                type: 'audio'
                            };
                            const audioMessageElement = audioRecorder.renderAudioMessage(audioData, msg.sender_id === currentUserId);
                            
                            // Create proper container for the audio message
                            const container = document.createElement('div');
                            container.className = `message ${msg.sender_id === currentUserId ? 'sent' : 'received'}`;
                            container.dataset.messageId = msg.id;
                            container.appendChild(audioMessageElement);
                            
                            messagesContainer.appendChild(container);
                        } else {
                            // Fallback if audio data is incomplete
                            addMessageToChat("[Audio message]", msg.sender_id === currentUserId, msg.created_at, msg.id, msg.status);
                        }
                    } else {
                        addMessageToChat(msg.content, msg.sender_id === currentUserId, msg.created_at, msg.id, msg.status);
                    }
                });
                
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                
                // Mark messages as read
                await markMessagesAsRead(userId);
                
            } catch (error) {
                console.error('Failed to load messages:', error);
                messagesContainer.innerHTML = `
                    <div class="error-state">
                        <div class="error-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <p class="error-message">Failed to load messages</p>
                        <button class="error-button" onclick="loadMessages('${userId}')">Retry</button>
                    </div>
                `;
            }
        }

        async function markMessagesAsRead(userId) {
            try {
                const { error } = await supabaseClient
                    .from('messages')
                    .update({ 
                        is_read: true,
                        read_at: new Date().toISOString(),
                        status: 'read'
                    })
                    .eq('receiver_id', currentUserId)
                    .eq('sender_id', userId)
                    .eq('is_read', false);
                
                if (error) throw error;

                delete unreadMessages[userId];

                if (userCard) {

                console.error('Failed to mark messages as read:', error);
            }
        }

        async function sendMessage(receiverId, content, audioData = null) {
            try {
                // First verify we have a valid session
                const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
                if (!user || authError) {
                    // If no valid user, try to refresh the session
                    const { data: { session }, error } = await supabaseClient.auth.refreshSession();
                    if (error || !session?.user) {
                        alert("⚠️ Session expired. Please log in again.");
                        window.location.href = 'login.html';
                        return;
                    }
                    currentUserId = session.user.id;
                }

                showSendLoading();
                
                // Verify receiver exists
                const { data: receiver, error: receiverError } = await supabaseClient
                    .from('users')
                    .select('id')
                    .eq('id', receiverId)
                    .single();
                    
                if (receiverError || !receiver) {
                    throw new Error("Recipient not found");
                }

                let messageContent = content;
                let messageType = 'text';
                let audioUrl = null;
                let audioDuration = null;
                let audioWaveform = null;
                
                // If we have audio data, use that instead of text
                if (audioData) {
                    messageContent = 'Audio message';
                    messageType = 'audio';
                    audioUrl = audioData.url;
                    audioDuration = audioData.duration;
                    audioWaveform = audioData.waveform;
                }

                // Send the message with all required fields
                const { data: message, error: sendError } = await supabaseClient
                    .from('messages')
                    .insert([{
                        sender_id: currentUserId,
                        receiver_id: receiverId,
                        content: messageContent,
                        status: 'sent', // Initial status
                        device_type: currentDeviceType,
                        is_read: false,
                        created_at: new Date().toISOString(),
                        audio_url: audioUrl,
                        audio_duration: audioDuration,
                        audio_waveform: audioWaveform,
                        message_type: messageType
                    }])
                    .select()
                    .single();
                
                if (sendError) throw sendError;
                
                // Update status to delivered once we know it's in the database
                await supabaseClient
                    .from('messages')
                    .update({ 
                        status: 'delivered',
                        delivered_at: new Date().toISOString()
                    })
                    .eq('id', message.id);
                
                // Render with delivered status
                if (audioData) {
                    const audioMessageElement = audioRecorder.renderAudioMessage(audioData, true);
                    document.getElementById('chatMessages').appendChild(audioMessageElement);
                } else {
                    addMessageToChat(content, true, new Date().toISOString(), message.id, 'delivered');
                }
                
                // Update last online status
                await supabaseClient
                    .from('users')
                    .update({ 
                        lastonline: new Date().toISOString(),
                        status: 'online'
                    })
                    .eq('id', currentUserId);
                
            } catch (error) {
                console.error('Failed to send message:', error);
                alert(`Failed to send message: ${error.message}\nPlease refresh the page and try again.`);
            } finally {
                hideSendLoading();
            }
        }

        function addMessageToChat(content, isSent, timestamp, messageId, status = 'delivered') {
            const messagesContainer = document.getElementById('chatMessages');
            
            if (messagesContainer.querySelector('.loading-state')) {
                messagesContainer.innerHTML = '';
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
            messageDiv.dataset.messageId = messageId;
            
            const messageContent = `
                <div class="message-content">
                    <p>${content}</p>
                    <div class="message-reactions">
                        <button class="reaction-button" onclick="showReactionPicker(this, '${messageId}')">
                            <span class="reaction-emoji">👍</span>
                            <span class="reaction-count">0</span>
                        </button>
                        <div class="reaction-picker">

                            <span class="reaction-emoji" onclick="addReaction('${messageId}', '😮')">😮</span>
                            <span class="reaction-emoji" onclick="addReaction('${messageId}', '😢')">😢</span>
                            <span class="reaction-emoji" onclick="addReaction('${messageId}', '🙏')">🙏</span>
                        </div>
                    </div>
                    <span class="message-time">${
                        new Date(timestamp || new Date()).toLocaleString([], {
                            hour: '2-digit',

                        })
                    }</span>
                    ${isSent ? `
                    <div class="message-status sent" data-message-id="${messageId}" data-status="${status}">
                        ${status === 'read' ?

                </div>
            `;
            
            messageDiv.innerHTML = messageContent;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Load existing reactions
            loadReactions(messageId);
