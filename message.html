        // Enhanced Typing Indicator Functions
        function showTypingIndicator(userId) {
            const userData = userDataCache[userId];
            if (!userData) return;
            
            // Update chat view if this is the selected user
            if (selectedUser && selectedUser.id === userId) {
                // Remove existing indicator if any
                if (typingIndicatorElement) {
                    typingIndicatorElement.remove();
                    typingIndicatorElement = null;
                }
                
                // Create new typing indicator
                typingIndicatorElement = document.createElement('div');
                typingIndicatorElement.className = 'typing-indicator active';
                typingIndicatorElement.innerHTML = `
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <span>${userData.name} is typing...</span>
                `;
                
                // Add to chat messages container
                const messagesContainer = document.getElementById('chatMessages');
                messagesContainer.appendChild(typingIndicatorElement);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
            
            // Update user list to show typing status
            const userCard = document.querySelector(`[data-user-id="${userId}"]`);
            if (userCard) {
                const statusText = userCard.querySelector('p');
                if (statusText) {
                    const typingElement = statusText.querySelector('.typing-indicator-badge');
                    if (!typingElement) {
                        const typingBadge = document.createElement('span');
                        typingBadge.className = 'typing-indicator-badge';
                        typingBadge.innerHTML = '<i class="fas fa-circle"></i> typing...';
                        statusText.appendChild(typingBadge);
                    }
                }
            }
            
            // Clear any existing timeout for this user
            if (typingStatus[userId]) {
                clearTimeout(typingStatus[userId]);
            }
            
            // Set timeout to hide the indicator after 5 seconds of inactivity
            typingStatus[userId] = setTimeout(() => {
                hideTypingIndicator(userId);
                delete typingStatus[userId];
            }, 5000);
        }

        function hideTypingIndicator(userId) {
            // Remove from chat view if this is the selected user
            if (selectedUser && selectedUser.id === userId && typingIndicatorElement) {
                typingIndicatorElement.classList.remove('active');
                setTimeout(() => {
                    if (typingIndicatorElement) {
                        typingIndicatorElement.remove();
                        typingIndicatorElement = null;
                    }
                }, 300);
            }
            
            // Remove from user list
            const userCard = document.querySelector(`[data-user-id="${userId}"]`);
            if (userCard) {
                const typingElement = userCard.querySelector('.typing-indicator-badge');
                if (typingElement) {
                    typingElement.remove();
                }
            }
        }

        function handleLocalTyping() {
            if (!selectedUser) return;
            
            const now = Date.now();
            
            // If user wasn't typing before, send start typing event
            if (!isTyping) {
                isTyping = true;
                if (presenceChannel && presenceChannel.subscriptionState === 'SUBSCRIBED') {
                    presenceChannel.send({
                        type: 'broadcast',
                        event: 'typing',
                        payload: { 
                            userId: currentUserId, 
                            partnerId: selectedUser.id 
                        }
                    }).catch(e => console.error('Error sending typing event:', e));
                }
            }
            
            lastTypingTime = now;
            
            // Clear existing timeout
            if (typingTimeout) {
                clearTimeout(typingTimeout);
            }
            
            // Set timeout to send stopped typing event after 5 seconds of inactivity
            typingTimeout = setTimeout(() => {
                if (isTyping && (now - lastTypingTime > 5000)) {
                    isTyping = false;
                    if (presenceChannel && presenceChannel.subscriptionState === 'SUBSCRIBED') {
                        presenceChannel.send({
                            type: 'broadcast',
                            event: 'stopped-typing',
                            payload: { 
                                userId: currentUserId,
                                partnerId: selectedUser.id
                            }
                        }).catch(e => console.error('Error sending stopped typing event:', e));
                    }
                }
            }, 5000);
        }

        // Realtime functionality with enhanced typing support
        async function initializeRealtime() {
            updateConnectionStatus("Connecting to real-time service...");
            
            try {
                // Remove existing channels if they exist
                if (presenceChannel) {
                    supabaseClient.removeChannel(presenceChannel);
                }

                // Presence channel for online status and typing indicators
                presenceChannel = supabaseClient.channel('presence-channel', {
                    config: { 
                        broadcast: { ack: true },
                        presence: { 
                            key: currentUserId,
                            heartbeatIntervalMs: 30000
                        } 
                    }
                })
                .on('presence', { event: 'sync' }, () => {
                    const state = presenceChannel.presenceState();
                    updateOnlineStatus(state);
                })
                .on('broadcast', { event: 'typing' }, ({ payload }) => {
                    // Show typing indicator when receiving typing event
                    if (payload.partnerId === currentUserId) {
                        showTypingIndicator(payload.userId);
                    }
                })
                .on('broadcast', { event: 'stopped-typing' }, ({ payload }) => {
                    // Hide typing indicator when receiving stopped typing event
                    if (payload.partnerId === currentUserId && typingIndicatorElement) {
                        typingIndicatorElement.classList.remove('active');
                        setTimeout(() => {
                            if (typingIndicatorElement) {
                                typingIndicatorElement.remove();
                                typingIndicatorElement = null;
                            }
                        }, 300);
                    }
                })
                .subscribe(async (status, error) => {
                    if (status === 'SUBSCRIBED') {
                        await presenceChannel.track({ 
                            online_at: new Date().toISOString(),
                            user_id: currentUserId,
                            device_type: currentDeviceType,
                            battery_level: batteryLevel
                        });
                        updateConnectionStatus("Connected");
                    }
                    if (error) {
                        console.error('Presence channel error:', error);
                        updateConnectionStatus("Error: " + error.message, true);
                        setTimeout(initializeRealtime, 5000);
                    }
                });

                // Handle channel connection events with exponential backoff
                let reconnectAttempts = 0;
                
                presenceChannel.on('close', () => {
                        updateConnectionStatus("Disconnected", true);
                        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                        reconnectAttempts++;
                        setTimeout(initializeRealtime, delay);
                    })
                    .on('error', (err) => {
                        console.error('Realtime error:', err);
                        updateConnectionStatus("Error: " + err.message, true);
                    });

                // Messages channel
                const messagesChannel = supabaseClient.channel('messages-channel')
                    .on(
                        'postgres_changes',
                        {
                            event: '*', // Listen for all changes (INSERT, UPDATE)
                            schema: 'public',
                            table: 'messages',
                            filter: `receiver_id=eq.${currentUserId}`
                        },
                        (payload) => {
                            const message = payload.new;
                            
                            if (payload.eventType === 'INSERT') {
                                // Existing new message handling...
                                const newMessage = payload.new;
                                
                                // Update unread count
                                if (!unreadMessages[newMessage.sender_id]) {
                                    unreadMessages[newMessage.sender_id] = 0;
                                }
                                unreadMessages[newMessage.sender_id]++;
                                
                                // Update UI
                                const userCard = document.querySelector(`[data-user-id="${newMessage.sender_id}"]`);
                                if (userCard) {
                                    userCard.classList.add('has-unread');
                                }
                                
                                // If currently chatting with this user, show message and mark as read
                                if (selectedUser && selectedUser.id === newMessage.sender_id) {
                                    if (newMessage.message_type === 'audio') {
                                        const audioData = {
                                            id: newMessage.id,
                                            url: newMessage.audio_url,
                                            duration: newMessage.audio_duration,
                                            waveform: newMessage.audio_waveform,
                                            type: 'audio'
                                        };
                                        const audioMessageElement = audioRecorder.renderAudioMessage(audioData, false);
                                        document.getElementById('chatMessages').appendChild(audioMessageElement);
                                    } else {
                                        addMessageToChat(
                                            newMessage.content, 
                                            false, 
                                            newMessage.created_at, 
                                            newMessage.id,
                                            newMessage.status
                                        );
                                    }
                                    markMessagesAsRead(newMessage.sender_id);
                                } else {
                                    // Show notification for new message
                                    const userData = userDataCache[newMessage.sender_id];
                                    if (userData) {
                                        showNotification({
                                            title: userData.name,
                                            body: newMessage.content,
                                            icon: userData.avatar_url,
                                            userId: newMessage.sender_id,
                                            userName: userData.name,
                                            avatar_url: userData.avatar_url,
                                            messageId: newMessage.id,
                                            type: 'message'
                                        });
                                    }
                                }
                            }
                            else if (payload.eventType === 'UPDATE') {
                                // Handle status updates
                                updateMessageStatus(message.id, message.status, message.read_at);
                            }
                        }
                    )
                    .subscribe();

                // Add this new helper function:
                function updateMessageStatus(messageId, status, readAt) {
                    // Update in chat view
                    const statusElement = document.querySelector(`.message-status[data-message-id="${messageId}"]`);
                    if (statusElement) {
                        statusElement.dataset.status = status;
                        statusElement.innerHTML = status === 'read' ? 
                            '<i class="status-icon read fas fa-check-double"></i>' : 
                            '<i class="status-icon delivered fas fa-check"></i>';
                        
                        if (readAt) {
                            const timeElement = statusElement.closest('.message-content').querySelector('.message-time');
                            if (timeElement) {
                                timeElement.textContent = new Date(readAt).toLocaleString([], {
                                    hour: '2-digit', 
                                    minute: '2-digit',
                                    month: 'short',
                                    day: 'numeric'
                                });
                            }
                        }
                    }
                    
                    // Update in user list if needed
                    if (status === 'read' && selectedUser) {
                        const unreadCount = unreadMessages[selectedUser.id];
                        if (unreadCount > 0) {
                            unreadMessages[selectedUser.id]--;
                            if (unreadMessages[selectedUser.id] === 0) {
                                document.querySelector(`[data-user-id="${selectedUser.id}"]`)?.classList.remove('has-unread');
                            }
                        }
                    }
                }

                // Locations channel for real-time location updates
                const locationsChannel = supabaseClient.channel('locations-channel')
                    .on(
                        'postgres_changes',
                        {
                            event: '*',
                            schema: 'public',
                            table: 'user_locations'
                        },
                        (payload) => {
                            const locationData = payload.new;
                            const userId = locationData.user_id;
                            
                            // Skip our own updates
                            if (userId === currentUserId) return;
                            
                            // Cache the location
                            locationCache[userId] = locationData;
                            
                            // Update user data cache
                            if (userDataCache[userId]) {
                                if (!userDataCache[userId].user_locations) {
                                    userDataCache[userId].user_locations = [];
                                }
                                
                                const existingIndex = userDataCache[userId].user_locations.findIndex(
                                    loc => loc.user_id === userId
                                );
                                
                                if (existingIndex >= 0) {
                                    userDataCache[userId].user_locations[existingIndex] = locationData;
                                } else {
                                    userDataCache[userId].user_locations.push(locationData);
                                }

                                // Update battery level in cache
                                userDataCache[userId].battery_level = locationData.device_context?.battery_level || null;
                            }
                            
                            // Update marker if showing locations
                            if (showUserLocations) {
                                updateUserMarkers([userDataCache[userId]]);
                            }
                            
                            // Update status text in user list
                            const userCard = document.querySelector(`[data-user-id="${userId}"]`);
                            if (userCard) {
                                const statusText = userCard.querySelector('p');
                                const batteryIndicator = userCard.querySelector('.battery-indicator');
                                
                                if (statusText) {
                                    const lastOnline = userDataCache[userId]?.lastonline ? 
                                        new Date(userDataCache[userId].lastonline) : null;
                                    const isOnline = onlineUsers[userId] || 
                                        (userDataCache[userId]?.status === 'online' && lastOnline && 
                                        (Date.now() - lastOnline.getTime()) < 300000);
                                    
                                    statusText.innerHTML = `
                                        <span>${isOnline ? 'Online' : formatLastOnline(lastOnline)}</span>
                                        ${userDataCache[userId]?.device_type ? `<span>• ${getDeviceEmoji(userDataCache[userId].device_type)}</span>` : ''}
                                    `;
                                }

                                // Update battery indicator
                                if (batteryIndicator && locationData.device_context?.battery_level) {
                                    const batteryLevel = locationData.device_context.battery_level;
                                    batteryIndicator.innerHTML = `
                                        <i class="fas ${getBatteryIcon(batteryLevel)}"></i>
                                        <span>${batteryLevel}%</span>
                                    `;
                                    batteryIndicator.className = `battery-indicator ${getBatteryColor(batteryLevel)}`;
                                }
                            }
                        }
                    )
                    .subscribe();

                // Add reaction updates
                const reactionsChannel = supabaseClient.channel('reactions-channel')
                    .on(
                        'postgres_changes',
                        {
                            event: 'UPDATE',
                            schema: 'public',
                            table: 'messages',
                            filter: `reactions->>'${currentUserId}' IS NOT NULL`
                        },
                        (payload) => {
                            updateReactionUI(payload.new.id, payload.new.reactions);
                        }
                    )
                    .subscribe();

            } catch (error) {
                console.error('Realtime initialization error:', error);
                updateConnectionStatus("Connection failed: " + error.message, true);
                setTimeout(initializeRealtime, 5000);
            }
        }

        // Event listeners
        function setupEventListeners() {
            // Message sending
            document.getElementById('sendButton').addEventListener('click', async () => {
                const input = document.getElementById('messageInput');
                const content = input.value.trim();
                if (!selectedUser) {
                    alert('Please select a user first');
                    return;
                }
                if (!content) {
                    alert('Message cannot be empty');
                    return;
                }
                await sendMessage(selectedUser.id, content);
                input.value = '';
                input.focus();
            });

            // Audio recording
            document.getElementById('audioRecordButton').addEventListener('click', async () => {
                const hasPermission = await audioRecorder.checkMicrophonePermission();
                if (!hasPermission) {
                    alert('Microphone access is required for audio messages');
                    return;
                }

                // Start recording and wait for result
                const audioData = await audioRecorder.startRecording();
                
                // If we got audio data and have a selected user, send it
                if (audioData && selectedUser) {
                    await sendMessage(selectedUser.id, null, audioData);
                }
            });

            // Typing indicator
            let isTyping = false;
            let lastTypingTime = 0;
            let typingTimer;
            
            document.getElementById('messageInput').addEventListener('input', () => {
                if (!selectedUser) return;
                
                const now = Date.now();
                if (!isTyping) {
                    isTyping = true;
                    presenceChannel.send({
                        type: 'broadcast',
                        event: 'typing',
                        payload: { userId: currentUserId, partnerId: selectedUser.id }
                    });
                }
                
                lastTypingTime = now;
                
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => {
                    if (now - lastTypingTime > 5000 && isTyping) {
                        isTyping = false;
                        presenceChannel.send({
                            type: 'broadcast',
                            event: 'stopped-typing',
                            payload: { userId: currentUserId }
                        });
                    }
                }, 5000);
            });

            // Menu button (mobile)
            document.getElementById('menuButton').addEventListener('click', () => {
                document.getElementById('sidebar').classList.add('active');
                document.body.classList.add('sidebar-open');
            });

            // Close sidebar button
            document.getElementById('closeSidebar').addEventListener('click', () => {
                document.getElementById('sidebar').classList.remove('active');
                document.body.classList.remove('sidebar-open');
            });

            // Open chat list from map
            document.getElementById('openChatListButton').addEventListener('click', () => {
                showChatListView();
            });

            // Back to map from chat view
            document.getElementById('backToMapButton').addEventListener('click', () => {
                showMapView();
            });

            // Account button
            document.getElementById('accountButton').addEventListener('click', () => {
                window.location.href = 'accounts.html';
            });

            // Center map button with animation
            document.getElementById('centerMapButton').addEventListener('click', () => {
                if (lastPosition && marker) {
                    map.flyTo([lastPosition.lat, lastPosition.lng], 15, {
                        duration: 0.5,
                        easeLinearity: 0.25
                    });
                } else {
                    map.setView([0, 0], 2);
                }
            });
            
            // Toggle user locations button
            document.getElementById('toggleUserLocationsButton').addEventListener('click', () => {
                showUserLocations = !showUserLocations;
                const button = document.getElementById('toggleUserLocationsButton');
                button.classList.toggle('active', showUserLocations);
                
                // Add visual feedback
                button.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    button.style.transform = '';
                }, 200);
                
                if (showUserLocations) {
                    loadUsers();
                } else {
                    // Remove all user markers except our own
                    Object.keys(userMarkers).forEach(userId => {
                        if (userId !== currentUserId && userMarkers[userId]) {
                            map.removeLayer(userMarkers[userId]);
                            delete userMarkers[userId];
                        }
                    });
                }
            });

            // Message input typing detection
            const messageInput = document.getElementById('messageInput');
            if (messageInput) {
                messageInput.addEventListener('input', handleLocalTyping);
                messageInput.addEventListener('focus', handleLocalTyping);
                messageInput.addEventListener('blur', () => {
                    if (isTyping) {
                        isTyping = false;
                        if (presenceChannel && presenceChannel.subscriptionState === 'SUBSCRIBED') {
                            presenceChannel.send({
                                type: 'broadcast',
                                event: 'stopped-typing',
                                payload: { 
                                    userId: currentUserId,
                                    partnerId: selectedUser ? selectedUser.id : null
                                }
                            }).catch(e => console.error('Error sending stopped typing event:', e));
                        }
                    }
                });
            }

            // Map location button
            document.getElementById('mapLocationButton').addEventListener('click', () => {
                if (map && lastPosition) {
                    // Center map on user's location
                    map.setView([lastPosition.lat, lastPosition.lng], 15);
                    
                    // Show the marker's popup
                    if (marker) {
                        marker.openPopup();
                    }
                } else {
                    // If no location yet, request it
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            lastPosition = {
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            };
                            if (map) {
                                map.setView([lastPosition.lat, lastPosition.lng], 15);
                                if (marker) {
                                    marker.setLatLng([lastPosition.lat, lastPosition.lng]);
                                    marker.openPopup();
                                }
                            }
                        },
                        (error) => {
                            console.error('Error getting location:', error);
                        },
                        {
                            enableHighAccuracy: true,
                            timeout: 5000,
                            maximumAge: 0
                        }
                    );
                }
            });
        }

        // Clean up on page unload
        window.addEventListener('beforeunload', async () => {
            try {
                if (presenceChannel) {
                    await supabaseClient.removeChannel(presenceChannel);
                }
                
                if (watchId && navigator.geolocation) {
                    navigator.geolocation.clearWatch(watchId);
                }
                
                if (keepAliveInterval) {
                    clearInterval(keepAliveInterval);
                }
                
                // Update user status to offline
                await supabaseClient
                    .from('users')
                    .update({ 
                        status: 'offline',
                        lastonline: new Date().toISOString()
                    })
                    .eq('id', currentUserId);
                
            } catch (error) {
                console.error('Cleanup error:', error);
            }
        });

        // Initialize the application
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Register service worker
                if ('serviceWorker' in navigator) {
                    try {
                        const registration = await navigator.serviceWorker.register('/sw.js');
                        console.log('ServiceWorker registration successful');
                    } catch (error) {
                        console.error('ServiceWorker registration failed:', error);
                    }
                }

                // Initialize Supabase client
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: false,
                        storage: {
                            getItem: (key) => {
                                return localStorage.getItem(key) || 
                                       localStorage.getItem('sb-' + SUPABASE_URL.split('//')[1].split('.')[0] + '-auth-token') || 
                                       localStorage.getItem('session');
                            },
                            setItem: (key, value) => localStorage.setItem(key, value),
                            removeItem: (key) => localStorage.removeItem(key)
                        }
                    }
                });

                // Add keep-alive mechanism
                const keepAliveInterval = 5 * 60 * 1000; // Every 5 minutes
                setInterval(async () => {
                    try {
                        // Make a small Supabase query to keep the connection alive
                        const { data, error } = await supabaseClient
                            .from('users')
                            .select('id')
                            .limit(1);
                        
                        if (error) throw error;
                        
                        // Also ping the server
                        fetch('/health')
                            .then(response => {
                                if (!response.ok) {
                                    console.error('Server health check failed');
                                }
                            })
                            .catch(error => {
                                console.error('Server ping failed:', error);
                            });
                    } catch (error) {
                        console.error('Keep-alive failed:', error);
                    }
                }, keepAliveInterval);

                // Check session in background
                const { data: { session: currentSession }, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError) throw sessionError;
                session = currentSession;

                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }
                currentUserId = session?.user?.id;

                // Verify user
                const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
                if (authError) throw authError;
                if (!user) throw new Error("User verification failed");

                // Initialize audio recorder
                audioRecorder.initialize(supabaseClient, currentUserId);

                // Initialize ProfileView
                if (window.ProfileView) {
                    window.ProfileView.initialize(supabaseClient, currentUserId);
                } else {
                    console.error('ProfileView module not loaded');
                }

                // Show main interface
                document.querySelector('.session-check').style.display = 'none';
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendButton').disabled = false;

                // Initialize map with satellite view by default on mobile
                initializeMap();
                
                // Load users and setup event listeners
                await loadUsers();
                setupEventListeners();
                initializeRealtime();

                // Set up auth state change listener
                supabaseClient.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_OUT') {
                        window.location.href = 'login.html';
                    } else if (event === 'TOKEN_REFRESHED') {
                        console.log('Token refreshed, reinitializing realtime');
                        initializeRealtime();
                    }
                });

                // Initialize battery monitoring
                initBatteryMonitoring();

                setupTypingBroadcast();
                handleUserTyping();

                // Initialize notifications
                await initializeNotifications();

            } catch (error) {
                console.error("Initialization error:", error);
                document.querySelector('.session-check').innerHTML = `
                    <div class="session-check-logo">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h1 class="session-check-title">Initialization Error</h1>
                    <p class="session-check-subtitle" style="color: var(--danger);">${error.message}</p>
                    <button onclick="window.location.href='login.html'" 
                            style="padding: 12px 24px; background: var(--primary); border: none; border-radius: var(--radius-md); font-weight: 600;">
                        Go to Login
                    </button>
                `;
            }
        });

        // Handle notification clicks
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data.userId) {
                    const user = userDataCache[event.data.userId];
                    if (user) selectUser(user);
                }
            });
        }

        // Auto-resize for the message input
        const input = document.getElementById("messageInput");
        if (input) {
            input.style.overflow = "hidden";

            const autoResize = () => {
                input.style.height = "auto";
                input.style.height = input.scrollHeight + "px";
            };

            input.addEventListener("input", autoResize);
            autoResize(); // Init on page load
        }

        // Initialize search functionality
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase().trim();
                const users = Object.values(userDataCache);
                
                if (searchTerm === '') {
                    renderUserList(users);
                    return;
                }

                const filteredUsers = users.filter(user => {
                    const name = (user.name || '').toLowerCase();
                    const email = (user.email || '').toLowerCase();
                    return name.includes(searchTerm) || email.includes(searchTerm);
                });

                renderUserList(filteredUsers);
            });
        }

        // Add these new functions for reaction handling
        function showReactionPicker(button, messageId) {
            const picker = button.nextElementSibling;
            picker.classList.toggle('active');
            
            // Close other pickers
            document.querySelectorAll('.reaction-picker').forEach(p => {
                if (p !== picker) p.classList.remove('active');
            });
        }

        async function addReaction(messageId, emoji) {
            try {
                const { data: message, error } = await supabaseClient
                    .from('messages')
                    .select('reactions')
                    .eq('id', messageId)
                    .single();
                    
                if (error) throw error;
                
                let reactions = message.reactions || {};
                if (!reactions[emoji]) reactions[emoji] = [];
                
                // Remove user's previous reaction if any
                Object.keys(reactions).forEach(e => {
                    reactions[e] = reactions[e].filter(id => id !== currentUserId);
                });
                
                // Add new reaction
                if (!reactions[emoji].includes(currentUserId)) {
                    reactions[emoji].push(currentUserId);
                }
                
                // Update database
                const { error: updateError } = await supabaseClient
                    .from('messages')
                    .update({ reactions: reactions })
                    .eq('id', messageId);
                    
                if (updateError) throw updateError;
                
                // Update UI
                updateReactionUI(messageId, reactions);
                
                // Close picker
                document.querySelectorAll('.reaction-picker').forEach(p => p.classList.remove('active'));
                
            } catch (error) {
                console.error('Failed to add reaction:', error);
            }
        }

        async function loadReactions(messageId) {
            try {
                const { data: message, error } = await supabaseClient
                    .from('messages')
                    .select('reactions')
                    .eq('id', messageId)
                    .single();
                    
                if (error) throw error;
                
                if (message.reactions) {
                    updateReactionUI(messageId, message.reactions);
                }
            } catch (error) {
                console.error('Failed to load reactions:', error);
            }
        }

        function updateReactionUI(messageId, reactions) {
            const messageDiv = document.querySelector(`[data-message-id="${messageId}"]`);
            if (!messageDiv) return;
            
            const reactionButton = messageDiv.querySelector('.reaction-button');
            if (!reactionButton) return;
            
            // Clear existing reactions
            reactionButton.innerHTML = '';
            
            // Only show reactions if there are any
            const hasReactions = Object.entries(reactions).some(([_, users]) => users.length > 0);
            
            if (hasReactions) {
                // Add reactions with counts
                Object.entries(reactions).forEach(([emoji, users]) => {
                    if (users.length > 0) {
                        const reactionSpan = document.createElement('span');
                        reactionSpan.className = 'reaction-emoji';
                        reactionSpan.textContent = emoji;
                        
                        const countSpan = document.createElement('span');
                        countSpan.className = 'reaction-count';
                        countSpan.textContent = users.length;
                        
                        reactionButton.appendChild(reactionSpan);
                        reactionButton.appendChild(countSpan);
                    }
                });
                messageDiv.classList.add('has-reactions');
            } else {
                // If no reactions, show the default reaction button
                reactionButton.innerHTML = `
                    <span class="reaction-emoji">👍</span>
                    <span class="reaction-count">0</span>
                `;
                messageDiv.classList.remove('has-reactions');
            }
        }

        // Location Services
        let locationPermissionGranted = false;

        function showLocationPopup() {
            document.getElementById('locationOverlay').classList.add('active');
            document.getElementById('locationPopup').classList.add('active');
        }

        function hideLocationPopup() {
            document.getElementById('locationOverlay').classList.remove('active');
            document.getElementById('locationPopup').classList.remove('active');
        }

        async function requestLocationPermission() {
            try {
                const status = document.getElementById('locationStatusText');
                status.textContent = 'Requesting location access...';
                
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    });
                });

                locationPermissionGranted = true;
                lastPosition = position;
                status.textContent = 'Location access granted';
                hideLocationPopup();
                
                // Initialize map with user's location
                if (map) {
                    map.setView([position.coords.latitude, position.coords.longitude], 15);
                    updateUserLocation(position);
                }
            } catch (error) {
                const status = document.getElementById('locationStatusText');
                status.textContent = 'Location access denied';
                console.error('Error getting location:', error);
            }
        }

        // Remove the old location permission popup handlers
        document.getElementById('enableLocationButton')?.removeEventListener('click', requestLocationPermission);
        document.getElementById('cancelLocationButton')?.removeEventListener('click', hideLocationPopup);
        document.getElementById('closeLocationPopup')?.removeEventListener('click', hideLocationPopup);
        document.getElementById('locationOverlay')?.removeEventListener('click', hideLocationPopup);

        // Remove the old location popup HTML
        const oldPopup = document.getElementById('locationOverlay');
        if (oldPopup) {
            oldPopup.remove();
        }

        // Initialize notifications
        initializeNotifications();

    </script>
</body>
</html>
